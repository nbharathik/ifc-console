[project]
name = "ifc-console-property-agent-example"
version = "0.1.0"
description = "Standalone LangChain example built on the framework-neutral IFC Console SDK."
requires-python = ">=3.10,<3.15"
dependencies = [
    "ifc-console",
    "langchain>=1,<2",
    "langchain-openai>=1,<2",
]

[project.optional-dependencies]
viewer = [
    "ifc-console[viewer]",
]

[tool.uv]
package = false

[tool.uv.sources]
ifc-console = { path = "../../..", editable = true }
