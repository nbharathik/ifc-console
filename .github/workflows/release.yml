name: Release

# Publishes to PyPI via trusted publishing when a v* tag is pushed.
# One-time setup: on PyPI, add a trusted publisher for this repository,
# workflow "release.yml", environment "pypi". No token secrets needed.

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run ruff check src tests packages
      - run: uv run pytest

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build both distributions
        run: |
          uv build
          uv build --package ifc-console-viewer
      - name: Verify the split
        run: uv run python scripts/check_wheels.py
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  docs:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push to gh-pages
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Deploy docs to GitHub Pages
        run: |
          uv sync --extra docs
          uv run mkdocs gh-deploy --force
