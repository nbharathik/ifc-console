name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  UV_LOCKED: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python }}
      - name: Verify frozen dependencies
        run: uv lock --check
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Tests
        run: uv run pytest tests packages/ifc-console-agents/tests

  package:
    name: Quality and package boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.3"
          python-version: "3.12"
      - name: Verify source metadata and vendored assets
        run: |
          uv lock --check
          uv run python scripts/check_release.py
          uv run python scripts/check_vendor_assets.py
      - name: Sync quality dependencies
        run: uv sync --extra dev
      - name: Lint and compile
        run: |
          uv run ruff check src tests packages scripts
          uv run python -m compileall -q src tests packages scripts
          node --check src/ifc_console/viewer/static/app.js
          node --check src/ifc_console/viewer/static/parser.js
          node --check src/ifc_console/viewer/static/worker.js
          node --check packages/ifc-console-agents/src/ifc_console_agents/static/chat.js
          node --check packages/ifc-console-agents/src/ifc_console_agents/static/chat-page.js
      - name: Build and inspect all release packages
        run: |
          uv build --out-dir ci-dist
          uv build --package ifc-console-agents --out-dir ci-dist
          uv build --package ifc-console-viewer --out-dir ci-dist
          uv run python scripts/check_wheels.py --dist-dir ci-dist

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.3"
      - name: Build docs
        run: |
          uv lock --check
          uv sync --extra docs
          uv run mkdocs build --strict
