name: Security audit

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_LOCKED: "1"

concurrency:
  group: security-audit
  cancel-in-progress: true

jobs:
  source:
    name: Python source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: false
          version: "0.12.3"
      - name: Scan Python source
        run: >-
          uvx --python 3.12 --from bandit==1.8.6
          bandit -q -r src packages/ifc-console-agents/src -ll

  dependencies:
    name: Dependencies (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: false
          python-version: ${{ matrix.python }}
          version: "0.12.3"
      - name: Verify dependency lock
        run: uv lock --check
      - name: Export locked runtime dependency boundaries
        shell: bash
        run: |
          uv export --package ifc-console --no-dev --no-emit-workspace --extra geometry --extra validation --format requirements-txt --output-file audit-core.txt --quiet
          uv export --package ifc-console-agents --no-dev --no-emit-workspace --format requirements-txt --output-file audit-agents-base.txt --quiet
          uv export --package ifc-console-agents --no-dev --no-emit-workspace --extra documents --format requirements-txt --output-file audit-agents-documents.txt --quiet
          uv export --package ifc-console-agents --no-dev --no-emit-workspace --extra graph --format requirements-txt --output-file audit-agents-graph.txt --quiet
      - name: Audit each runtime dependency boundary
        shell: bash
        env:
          AUDIT_PYTHON: ${{ matrix.python }}
        run: |
          for requirements in audit-core.txt audit-agents-base.txt audit-agents-documents.txt audit-agents-graph.txt; do
            echo "Auditing $requirements"
            uvx --python "$AUDIT_PYTHON" --from pip-audit==2.10.1 pip-audit -r "$requirements" --disable-pip
          done

  workflows:
    name: GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: false
          version: "0.12.3"
      - name: Audit GitHub Actions
        run: uvx zizmor==1.29.0 --pedantic .github/workflows
