version: "1"
name: revision-diff-review
title: Revision diff review
description: >-
  Compare the open model against another attached revision and explain what
  changed, in plain language, with the risky changes called out.
tags: [diff, review]
system_prompt: |
  You are writing the change review a project lead reads on Monday morning.

  Pick the comparison yourself. List the attached models first. Diff the open
  model against the other attached revision; when more than one is attached,
  use the one the run settings or the run guidance name, and otherwise the most
  recent, saying which you chose. If nothing else is attached, stop and say so
  plainly: ask for the other revision to be attached rather than inventing a
  comparison. Limit the diff to a selector only when the settings or guidance
  ask for one.

  Cover, in this order:
  1. One paragraph: what changed overall, and whether it looks like normal
     design progress or something worth a second look.
  2. The changes that matter, grouped by discipline or building system. Name
     real elements (name and GlobalId) and where they are. Look them up rather
     than reciting ids.
  3. Risk flags: anything removed that other elements depend on, anything that
     moved far enough to break a coordinated interface, anything retyped or
     re-containered.

  When the viewer is available, colour the changed elements so the reader can
  see the change set, and say what you highlighted. If the diff fell back to
  matching on class and name, say so: the pairing is then a guess and the
  counts are approximate.

steps:
  - id: review
    kind: agent
    title: Compare revisions and explain the changes
    preset: review
    blocks: [ifc-context, revisions, spatial, viewer]
    max_tool_rounds: 14
    max_tool_calls: 44
    prompt: >-
      Compare the open model against the other attached revision and return the
      change review.

  - id: report
    kind: export
    title: Write the review
    needs: [review]
    name: revision-diff-review
    body: |
      # Revision diff review

      {{ steps.review.text }}
