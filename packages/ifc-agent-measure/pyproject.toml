[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "ifc-agent-measure"
version = "0.1.0"
description = "Document-grounded measurement agent for IFC models, built on ifc-console."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
authors = [{ name = "nbharathik" }]
keywords = ["ifc", "bim", "agent", "measurement", "quantity-takeoff"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]
# tighten to >=0.2 when the SDK release ships
dependencies = ["ifc-console>=0.1.4,<0.3"]

[project.scripts]
ifc-measure = "ifc_agent_measure.__main__:main"

[project.optional-dependencies]
viewer = ["ifc-console[viewer]"]
pdf = ["ifc-console[pdf]"]

[project.urls]
Homepage = "https://github.com/nbharathik/ifc-console"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.uv.sources]
ifc-console = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ifc_agent_measure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
