[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ifc-console-viewer"
version = "0.2.0"
description = "Static assets for the ifc-console 3D web viewer (three.js + web-ifc)."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "Apache-2.0" }
authors = [{ name = "nbharathik" }]
keywords = ["ifc", "bim", "viewer", "three.js", "web-ifc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
# Assets only: no runtime dependencies, and nothing imports this at startup.
dependencies = []

[project.urls]
Homepage = "https://github.com/nbharathik/ifc-console"
Documentation = "https://nbharathik.github.io/ifc-console/viewer/"

[tool.hatch.build.targets.wheel]
# The static bundle sits inside the package directory, so it is picked up
# with it; this distribution is the assets.
packages = ["src/ifc_console_viewer"]
