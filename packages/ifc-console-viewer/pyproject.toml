[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "ifc-console-viewer"
version = "0.1.4"
description = "Optional browser assets for the ifc-console 3D viewer (three.js and web-ifc)."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "nbharathik" }]
keywords = ["ifc", "bim", "viewer", "three.js", "web-ifc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
# Assets only: it can also be inspected independently and has no runtime
# dependency on the core package.
dependencies = []

[project.urls]
Homepage = "https://github.com/nbharathik/ifc-console"
Documentation = "https://nbharathik.github.io/ifc-console/viewer/"

[tool.hatch.build.targets.wheel]
packages = ["src/ifc_console_viewer"]
