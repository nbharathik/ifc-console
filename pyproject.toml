[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "ifc-console"
dynamic = ["version"]
description = "A local IFC workbench with MCP, SDK, guarded agents, workflows, and an optional 3D viewer."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "nbharathik" }]
keywords = ["ifc", "bim", "mcp", "ifcopenshell", "llm", "agents", "openbim"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # 1.16 is the first release with FastMCP.remove_tool, which /viewer off needs.
    "mcp>=1.16,<2",
    "ifcopenshell>=0.8.1,<0.9",
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
    "textual>=1.0",
    "uvicorn>=0.30",
    "starlette>=0.37",
    # McpToolSource constructs the HTTP transport directly.
    "httpx>=0.27",
    # detect_clashes does its broad phase and occupancy sampling in numpy;
    # rich renders the console feed. Both arrive transitively today, but the
    # imports are ours, so the dependency is ours.
    "numpy>=1.24",
    "rich>=13",
    # Built-in Docs and Measurement agents ingest PDF manuals. PyMuPDF makes
    # drawings and scanned pages available to vision models as page images.
    "pypdf>=4",
    "PyMuPDF>=1.24,<2",
    # The bundled chat panel can save provider credentials in the operating
    # system credential store. This is core agent functionality: keeping it
    # optional made the default UI offer a path that failed at runtime.
    "keyring>=24",
]

[project.optional-dependencies]
geometry = [
    # Raw health predicates only. Ray pairing stays in NumPy, so the heavy
    # Trimesh soft dependencies (rtree/scipy/networkx) are not required.
    "trimesh>=5.0.0,<5.1",
]
validation = [
    # IDS (Information Delivery Specification) checking for validate_ids
    # and `ifc-console check --ids`.
    "ifctester>=0.8",
]
graph = [
    # Opt-in durable orchestration for applications that build LangGraph
    # workflows over IFC Console's existing agents and toolsets.
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
]
viewer = [
    # The browser bundle is a separate wheel so the base install contains no
    # three.js, web-ifc JavaScript, or WASM. Its WebSocket transport is needed
    # only when that viewer is used.
    "ifc-console-viewer>=0.1,<0.2",
    "websockets>=12",
]
dev = [
    # Starlette's current TestClient prefers its supported httpx2 transport.
    "httpx2>=2,<3",
    "ifc-console-viewer>=0.1,<0.2",
    "ifctester>=0.8",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "trimesh>=5.0.0,<5.1",
    "websockets>=12",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
# Kept as a compatibility extra for existing install commands. PDF support is
# part of the base package because the bundled agents depend on it.
pdf = []
# Compatibility extras retained for existing installation commands. PDF and
# credential-store support are part of the base package because bundled agents
# and the panel use them directly.
keys = []

[project.urls]
Homepage = "https://github.com/nbharathik/ifc-console"
Documentation = "https://nbharathik.github.io/ifc-console/"
Repository = "https://github.com/nbharathik/ifc-console"
Issues = "https://github.com/nbharathik/ifc-console/issues"

[project.scripts]
ifc-console = "ifc_console.cli:main"

[tool.hatch.version]
path = "src/ifc_console/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ifc_console"]

[tool.hatch.build.targets.sdist]
# Tests stay in for downstream PEP 517 packagers. The uv workspace source is
# checkout-only, so an extracted base sdist should be installed with pip or
# `uv pip`, not synchronized as the original two-package workspace.
exclude = [
    "uv.lock",
    "docs/assets/brand/*.png",
    "dev",
    "dist",
    ".github",
    ".tmp",
    ".vscode",
    "packages",
    "site",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ifc-console-viewer = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
