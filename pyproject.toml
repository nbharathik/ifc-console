[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "ifc-console"
dynamic = ["version"]
description = "A local IFC workbench with a terminal, 3D viewer, MCP, SDK, and guarded workflows."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "nbharathik" }]
keywords = ["ifc", "bim", "mcp", "ifcopenshell", "llm", "agents", "openbim"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # 1.16 is the first release with FastMCP.remove_tool, which /viewer off needs.
    "mcp>=1.28,<2",
    "ifcopenshell>=0.8.1,<0.9",
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
    "textual>=1.0",
    "uvicorn>=0.30",
    "starlette>=0.37",
    # McpToolSource constructs the HTTP transport directly.
    "httpx>=0.27",
    # The bundled browser viewer communicates with the local application over
    # a WebSocket. It is standard IFC Console functionality, not an extra.
    "websockets>=12",
    # detect_clashes does its broad phase and occupancy sampling in numpy;
    # rich renders the console feed. Both arrive transitively today, but the
    # imports are ours, so the dependency is ours.
    "numpy>=1.24",
    "rich>=13",
    # Raw mesh health predicates only. Ray pairing stays in NumPy, so the heavy
    # Trimesh soft dependencies (rtree/scipy/networkx) are not required.
    "trimesh>=5.0.0,<5.1",
]

[project.optional-dependencies]
# The Agent workspace and engines work on the base install; these add the
# pieces that talk to the outside: agent engines over ACP, the OS keyring for
# provider keys, and PDF text and page rendering for project documents.
agents = [
    "agent-client-protocol>=0.12,<1",
    "keyring>=24",
    "pypdfium2>=4",
]
validation = [
    # IDS (Information Delivery Specification) checking for validate_ids
    # and `ifc-console check --ids`. Heavy transitive dependencies, so opt-in.
    "ifctester>=0.8",
]
all = [
    "agent-client-protocol>=0.12,<1",
    "keyring>=24",
    "pypdfium2>=4",
    "ifctester>=0.8",
]

[dependency-groups]
dev = [
    # Starlette's current TestClient prefers its supported httpx2 transport.
    "httpx2>=2,<3",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://github.com/nbharathik/ifc-console"
Documentation = "https://nbharathik.github.io/ifc-console/"
Repository = "https://github.com/nbharathik/ifc-console"
Issues = "https://github.com/nbharathik/ifc-console/issues"

[project.scripts]
ifc-console = "ifc_console.cli:main"

[tool.hatch.version]
path = "src/ifc_console/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ifc_console"]

[tool.hatch.build.targets.sdist]
# Tests stay in for downstream PEP 517 packagers.
exclude = [
    "uv.lock",
    "docs/assets/brand/*.png",
    "dev",
    "dist",
    ".github",
    ".tmp",
    ".vscode",
    "packages",
    "site",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
