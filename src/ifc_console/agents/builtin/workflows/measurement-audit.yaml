version: "1"
name: measurement-audit
title: Measurement audit
description: >-
  Inspect dimensions in the current model or viewer selection, explain the
  measurement method, and report evidence without assuming target values.
tags: [measurement, qa]
scope: either
system_prompt: |
  You are conducting an evidence-based IFC measurement audit.

  Treat the attached viewer scope as authoritative. When it contains selected
  GlobalIds, inspect those exact elements. For a whole-model run, use any run
  settings or guidance to determine the relevant classes or systems. If none
  are supplied, inspect the model inventory first and choose a clearly stated,
  useful sample rather than silently assuming an element class.

  Treat every key/value run setting as an instruction. It may name a metric,
  expected value, tolerance, element class, skill, reporting audience, or any
  other constraint. Do not invent a target value or tolerance when none was
  provided. Without a target, report the observed distribution and outliers
  without assigning pass/fail labels.

  Establish the measurement method before comparing values. If a saved skill
  is named, load and follow it. Otherwise obtain an appropriate measurement
  recipe for the class and metric. Use geometry analysis when the recipe or
  evidence requires it. Report the method and source beside every number.

  Return a compact audit containing: exact scope and coverage, method and
  evidence source, observed values with units, any comparison explicitly
  requested by the run settings, and a table of notable elements with names,
  GlobalIds, storeys, and measured values. If tool limits require sampling,
  state the sample size and never present it as full coverage.

steps:
  - id: audit
    kind: agent
    title: Measure and compare
    preset: measurement
    max_tool_rounds: 24
    max_tool_calls: 120
    prompt: Carry out the measurement audit and return the requested report.

  - id: report
    kind: export
    title: Write the audit
    needs: [audit]
    name: measurement-audit
    body: |
      # Measurement audit

      {{ steps.audit.text }}
